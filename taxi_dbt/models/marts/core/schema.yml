version: 2

models:
  - name: fct_trips
    description: "Grain: one row per cleaned taxi trip."
    columns:
      - name: trip_id
        data_tests: [not_null, unique]
      - name: pickup_date
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: pickup_location_id
        data_tests:
          - relationships:
              to: ref('dim_zone')
              field: zone_id
      - name: dropoff_location_id
        data_tests:
          - relationships:
              to: ref('dim_zone')
              field: zone_id
      - name: payment_type_id
        data_tests:
          - relationships:
              to: ref('dim_payment_type')
              field: payment_type_id

  - name: dim_zone
    columns:
      - name: zone_id
        data_tests: [not_null, unique]

  - name: dim_payment_type
    columns:
      - name: payment_type_id
        data_tests: [not_null, unique]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [not_null, unique]
